<section id="hours" class="section-page" data-pg-name="Opening hours board" data-pg-content-group="Opening hours">
    <div class="container-site">
        <h2 class="heading-section" data-pg-content-label="Title">Opening hours</h2>
        <p class="prose-copy mt-4 text-muted" data-pg-content-label="Board description">Example hours. Check with Crux before you travel, especially on bank holidays.</p>
        <table class="board mt-6 sm:mt-8">
            <caption class="sr-only">Opening hours</caption>
            <thead class="board-head">
                <tr>
                    <th scope="col" class="px-3 py-3 sm:px-6" data-pg-content-label="First column">Day</th>
                    <th scope="col" class="px-3 py-3 text-right sm:px-6" data-pg-content-label="Second column">Open</th>
                </tr>
            </thead>
            <tbody data-pg-content-collection="Board rows">
                <tr class="board-row" data-pg-content-item="Row">
                    <th class="board-cell" scope="row">
                        <span class="heading-item" data-pg-content-label="Name">Monday to Friday</span>

                    </th>
                    <td class="board-value">
                        <span class="block whitespace-nowrap" data-pg-content-label="Open">10:00–22:00</span>

                    </td>
                </tr>
                <tr class="board-row" data-pg-content-item="Row">
                    <th class="board-cell" scope="row">
                        <span class="heading-item" data-pg-content-label="Name">Saturday and Sunday</span>

                    </th>
                    <td class="board-value">
                        <span class="block whitespace-nowrap" data-pg-content-label="Open">09:00–20:00</span>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
